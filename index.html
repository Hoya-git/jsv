<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="JSV Dashboard">
<meta name="application-name" content="JSV Dashboard">
<meta name="theme-color" content="#2a78d6">
<title>JSV 샘플 현황 대시보드</title>
<style>
:root{
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s3:#1baf7a; --critical:#d03b3b;
  --pending-bg:#fbdea3; --pending-line:#e9c67e;
  --recv-bg:#d7dbfd; --recv-line:#b9bff5;
  --changed:#d03b3b;
  --pa-blue:#e4eafe;  --pa-blue-l:#c3cdf7;  --pa-blue-t:#274ea8;
  --pa-teal:#dcf3ec;  --pa-teal-l:#b4e2d3;  --pa-teal-t:#136a51;
  --pa-red:#fbe0e0;   --pa-red-l:#f0bcbc;   --pa-red-t:#a52c2c;
  --pa-amber:#fdeecd; --pa-amber-l:#f4d79a; --pa-amber-t:#8a6100;
  --pa-grey:#eeeeea;  --pa-grey-l:#dcdbd3;  --pa-grey-t:#5c5b56;
  --hot-red:#f6a9a9;  --hot-red-l:#e07a7a;
  --cut:#2a78d6; --sew:#e0629c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;font-size:15px;font-weight:600}
header{background:var(--surface-1);border-bottom:1px solid var(--grid);padding:14px 20px 0}
.hrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;font-weight:600}
.badge{font-size:12px;font-weight:700;padding:2px 7px;border-radius:99px;border:1px solid var(--ring);color:var(--ink2);background:var(--plane)}
nav{display:flex;gap:2px;margin-top:12px;align-items:center}
nav button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 16px;
  font:inherit;font-size:15px;font-weight:700;color:var(--ink2);cursor:pointer;border-radius:6px 6px 0 0}
nav button:hover{background:var(--plane)}
nav button[aria-selected=true]{color:var(--s1);border-bottom-color:var(--s1)}
main{padding:16px 20px 60px}
.panel{display:none;border:2px dashed transparent;border-radius:12px}.panel.on{display:block}
.panel.dropping{border-color:var(--s1);background:#eef4fd}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface-1);border:1px solid var(--ring);border-radius:99px;
  padding:6px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--s1);border-color:var(--s1);color:#fff;font-weight:700}
.chip[aria-pressed=true] *{color:#fff !important}
.cnt{display:inline-block;min-width:20px;text-align:center;font-size:12px;font-weight:800;
  border-radius:99px;padding:1px 6px;margin-left:4px;border:1px solid}
.cnt.recv{background:var(--recv-bg);border-color:var(--recv-line);color:#274ea8}
.cnt.pend{background:var(--pending-bg);border-color:var(--pending-line);color:#8a6100}
.chip[aria-pressed=true] .cnt.recv{background:var(--recv-bg) !important}
.chip[aria-pressed=true] .cnt.recv,{color:#274ea8 !important}
.chip[aria-pressed=true] .cnt{color:inherit !important}
.chip[aria-pressed=true] .cnt.recv{color:#274ea8 !important}
.chip[aria-pressed=true] .cnt.pend{color:#8a6100 !important}
.spacer{flex:1}
.btn{background:var(--s1);color:#fff;border:none;border-radius:7px;padding:8px 15px;
  font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--surface-1);color:var(--ink2);border:1px solid var(--ring)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:hover{filter:brightness(1.06)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.tile{border:1px solid var(--ring);border-radius:12px;padding:14px 16px;background:var(--surface-1)}
.tile .k{font-size:13px;font-weight:700;letter-spacing:.01em;opacity:.85}
.tile .v{font-size:34px;font-weight:800;margin-top:4px;letter-spacing:-.02em;line-height:1.1}
.tile .n{font-size:13px;font-weight:600;margin-top:3px;opacity:.8}
.tile .subn{font-size:13.5px;font-weight:700;margin-top:3px;opacity:.9}
.tile.blue {background:var(--pa-blue); border-color:var(--pa-blue-l); color:var(--pa-blue-t)}
.tile.teal {background:var(--pa-teal); border-color:var(--pa-teal-l); color:var(--pa-teal-t)}
.tile.red  {background:var(--pa-red);  border-color:var(--pa-red-l);  color:var(--pa-red-t)}
.tile.amber{background:var(--pa-amber);border-color:var(--pa-amber-l);color:var(--pa-amber-t)}
.tile.grey {background:var(--pa-grey); border-color:var(--pa-grey-l); color:var(--pa-grey-t)}
.tile.hot  {background:var(--hot-red); border-color:var(--hot-red-l); color:#6d1414}
.card{background:var(--surface-1);border:1px solid var(--ring);border-radius:10px;overflow:hidden}
.card h2{font-size:16px;margin:0;padding:12px 15px;font-weight:800}
.cardhead{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--grid);padding-right:12px}
.cardhead h2{flex:1;border:none}
.tw{overflow:auto;max-height:68vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;font-weight:600}
th{position:sticky;top:0;z-index:2;background:var(--plane);text-align:left;font-weight:800;font-size:14px;
  color:var(--ink2);padding:8px 9px;border-bottom:1px solid var(--axis);white-space:nowrap}
th.num{text-align:right}
td{padding:7px 9px;border-bottom:1px solid var(--grid);vertical-align:top}
tbody tr:hover{background:#f4f6fa}
tr.recv{background:var(--recv-bg)} tr.recv:hover{background:#c9cffb}
tr.pending{background:var(--pending-bg)} tr.pending:hover{background:#f7d38c}
tr.cancelled{background:#f9d5d5} tr.cancelled:hover{background:#f4c4c4}
tr.cancelled .cellin,tr.cancelled td{text-decoration:line-through;color:#8c2b2b}
tr.cancelled .cmt,tr.cancelled .rowdel,tr.cancelled .st{text-decoration:none}
tr.pending .cmt,tr.recv .cmt{background:rgba(255,255,255,.6)}
tr.totrow td{background:var(--plane);font-weight:800;border-top:2px solid var(--axis)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.chg{color:var(--changed);font-weight:800}
td.chg::after{content:none}
td.chg > .cellin{color:var(--changed);font-weight:800}
.st{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;
  padding:2px 8px;border-radius:99px;border:1px solid var(--ring);white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis}
.st.done{color:#0a7a0a;background:#eaf7ea}
.st.prog{color:#1c5cab;background:#eaf1fb}
.st.wait{color:#8a6a00;background:#fdf3d8}
.st.risk{color:#a92e2e;background:#fbeaea}
.st.cut{color:#1c5cab;background:#dfeafb;border-color:#bcd4f4}
.st.sew{color:#a3346a;background:#fbe2ee;border-color:#f2c3da}
.cmt{width:100%;border:1px dashed var(--axis);border-radius:5px;background:transparent;
  font:inherit;font-size:13px;font-weight:600;padding:4px 6px;color:var(--ink)}
.cmt:focus{outline:none;border-style:solid;border-color:var(--s1);background:#fff}
.auto{display:block;color:var(--changed);font-size:13px;font-weight:700;margin-bottom:3px}
.bar{height:9px;background:var(--grid);border-radius:99px;overflow:hidden;min-width:80px;display:flex}
.bar i{display:block;height:100%}
.bar i.c{background:var(--cut)} .bar i.s{background:var(--sew)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--ink2);margin:10px 2px 0}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--ring);
  vertical-align:-1px;margin-right:5px}
.lines{display:grid;gap:7px}
.lrow{display:grid;grid-template-columns:64px 1fr 54px;align-items:center;gap:10px;font-size:13px;font-weight:700}
.lrow .lb{height:17px;border-radius:4px;background:var(--s1);min-width:2px}
.muted{color:var(--muted)} .small{font-size:12px}
.wrap{max-width:230px;white-space:normal}
.shortcell{max-width:230px;white-space:normal;overflow:hidden}
input[type=checkbox]{accent-color:var(--s1);width:16px;height:16px;cursor:pointer}
.rowcancel{border:1px solid var(--ring);background:var(--surface-1);color:var(--critical);
  cursor:pointer;font:inherit;font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px}
.rowcancel:hover{background:#fbeaea}
.rowcancel.on{background:var(--critical);color:#fff;border-color:var(--critical)}
.rowdel{border:1px solid var(--critical);background:var(--critical);color:#fff;cursor:pointer;
  font:inherit;font-size:12.5px;font-weight:700;line-height:1.2;padding:5px 10px;border-radius:6px;white-space:nowrap}
.rowdel:hover{filter:brightness(1.1)}
.cellin{width:100%;border:1px solid transparent;border-radius:4px;background:transparent;
  font:inherit;font-size:14px;font-weight:600;padding:3px 5px;color:inherit}
.cellin:hover{border-color:var(--grid)}
.cellin:focus{outline:none;border-color:var(--s1);background:#fff}
.cellin.num{text-align:right;width:64px}
.cellin.ta{resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word;
  min-width:150px;line-height:1.4;display:block;font:inherit;font-size:13.5px}
td.longcell{min-width:160px}
td.editing.num{width:1%}
.topbar{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;font-weight:700;color:var(--ink2)}
.topbar select{font:inherit;font-size:13px;font-weight:700;padding:5px 9px;border-radius:7px;
  border:1px solid var(--ring);background:var(--surface-1);color:var(--ink);cursor:pointer}
.roleSALES .sales-only{display:inline-flex !important}
.sales-only{display:none !important}
.admin-only{display:none !important}
.roleDEV .admin-only{display:inline-flex !important}
.search{font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:8px;
  border:1px solid var(--axis);background:var(--surface-1);min-width:330px;color:var(--ink)}
.search:focus{outline:none;border-color:var(--s1)}
.photo{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--ring);cursor:zoom-in;background:var(--plane)}
.nophoto{width:56px;height:56px;border-radius:6px;border:1px dashed var(--axis);display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;
  justify-content:center;z-index:99;cursor:zoom-out}
#lightbox img{max-width:88vw;max-height:88vh;border-radius:8px}
.uplog{background:#eaf7ea;border:1px solid #cfe9cf;border-radius:9px;padding:10px 14px;
  font-size:13.5px;font-weight:600;color:#0a5f0a;margin-bottom:12px}
#pw-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;
  justify-content:center;z-index:200}
.pwbox{background:var(--surface-1);border-radius:14px;padding:24px 26px;min-width:340px;
  box-shadow:0 18px 50px rgba(0,0,0,.25)}
.pwbox h3{margin:0 0 6px;font-size:17px;font-weight:800}
.pwbox p{margin:0 0 14px;font-size:13.5px;color:var(--ink2);font-weight:600}
.pwbox input{width:100%;font:inherit;font-size:15px;padding:9px 12px;border-radius:8px;
  border:1px solid var(--axis);margin-bottom:8px}
.pwbox .err{color:var(--critical);font-size:13px;font-weight:700;min-height:18px;margin-bottom:8px}
.pwrow{display:flex;gap:8px;justify-content:flex-end}

/* 동기화 상태 */
.upstrip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.upstrip:empty{display:none}
.upchip.new{border-color:#d03b3b;background:#fdf1f0}
.upchip .reddot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d03b3b;margin-left:6px;vertical-align:1px;animation:updot 1.4s ease-in-out infinite}
.upchip .ackmark{color:#1c7a34;font-weight:800;margin-left:5px}
@keyframes updot{0%,100%{opacity:1}50%{opacity:.25}}
.sbst{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--plane);color:var(--ink2)}
.sbst.ok{background:#e3f4e6;color:#1c7a34}.sbst.busy{background:#fff3d6;color:#8a6100}
.sbst.err{background:#fde3e3;color:#b3261e}
/* 모바일 */
@media (max-width: 900px){
  body{padding:10px}
  header .hrow h1{font-size:18px}
  nav{flex-wrap:wrap;gap:0}
  nav button{padding:8px 10px;font-size:13px}
  nav .topbar{width:100%;justify-content:flex-end;padding:6px 0}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile .v{font-size:20px}
  #dev-body > div{grid-template-columns:1fr !important}
  #p-pending-grid{grid-template-columns:1fr !important}
  /* 넓은 표가 페이지 전체 폭을 늘리지 않도록: 그리드 자식의 최소 폭 해제 → 표는 .tw 안에서만 가로 스크롤 */
  #dev-body > div > *, #dev-body .card, #p-pending-grid > *{min-width:0;max-width:100%}
  main, .panel, .card{min-width:0}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  table{font-size:12px}
}

</style>
</head>
<body class="roleSALES">
<div id="lightbox"><img alt=""></div>
<div id="pw-modal"><div class="pwbox">
  <h3 id="pw-title">개발실 모드</h3>
  <p id="pw-msg">개발실 모드 비밀번호를 입력하세요.</p>
  <input type="password" id="pw-input" autocomplete="off">
  <div class="err" id="pw-err"></div>
  <div class="pwrow">
    <button class="btn ghost" id="pw-cancel">취소</button>
    <button class="btn" id="pw-ok">확인</button>
  </div>
</div></div>
<header>
  <div class="hrow">
    <h1 id="h-title">JSV 샘플 현황 대시보드</h1>
    <span class="sub" id="stamp"></span>
    <span id="sb-status" class="sbst"></span>
  </div>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-p="sales" id="tab-sales">샘플 현황 차트 (영업)</button>
    <button role="tab" aria-selected="false" data-p="dev" id="tab-dev">개발실 샘플 현황</button>
    <button role="tab" aria-selected="false" data-p="cost" id="tab-cost">원가 현황</button>
    <button role="tab" aria-selected="false" data-p="score" id="tab-score">바이어별 작업 분포도</button>
    <div class="topbar">
      <span id="lbl-lang">언어</span>
      <select id="lang-select">
        <option value="ko">한국어</option><option value="en">English</option><option value="vi">Tiếng Việt</option>
      </select>
      <span id="lbl-mode">모드</span>
      <select id="role-select">
        <option value="SALES" selected></option>
        <option value="DEV"></option>
      </select>
    </div>
  </nav>
</header>
<main>
<section class="panel on" id="p-sales">
  <div class="upstrip" id="up-strip"></div>
  <div class="tiles" id="sales-tiles"></div>
  <div class="toolbar">
    <div class="chips" id="brand-chips" style="flex:1"></div>
    <button class="btn ghost" id="btn-only-pending"></button>
    <button class="btn ghost" id="btn-only-cancel"></button>
    <button class="btn ghost" id="btn-show-done"></button>
    <span style="width:10px"></span>
    <button class="btn sales-only" id="btn-upload"></button>
    <button class="btn ghost" id="btn-xlsx-one"></button>
    <button class="btn ghost" id="btn-xlsx-all"></button>
    <input type="file" id="file-input" accept=".xlsx" multiple style="display:none">
  </div>
  <div id="upload-log" class="uplog" style="display:none"></div>
  <div class="card">
    <div class="cardhead">
      <h2 id="sales-title">Sample Plan</h2>
      <button class="btn ghost sm sales-only" id="btn-add-row"></button>
    </div>
    <div class="tw"><table id="t-sales"></table></div>
  </div>
  <div class="legend" id="sales-legend"></div>
</section>

<section class="panel" id="p-dev">
  <div class="tiles" id="dev-tiles"></div>
  <div class="toolbar">
    <div class="chips" id="src-chips"></div>
    <span class="spacer"></span>
    <input class="search" id="dev-search" type="search">
    <button class="btn admin-only" id="btn-dev-upload"></button>
    <input type="file" id="dev-file" accept=".xlsx,.xls" multiple style="display:none">
  </div>
  <div id="dev-log" class="uplog" style="display:none"></div>
  <div id="dev-body"></div>
</section>

<section class="panel" id="p-cost">
  <div class="tiles" id="cost-tiles"></div>
  <div class="toolbar">
    <span id="cost-lbl" style="font-weight:700"></span>
    <select id="cost-brand" class="topbar" style="font:inherit;font-size:14px;font-weight:700;padding:7px 12px;border-radius:8px;border:1px solid var(--axis);background:var(--surface-1)"></select>
    <div class="chips" id="cost-chips"></div>
    <span class="spacer"></span>
    <input class="search" id="cost-search" type="search">
    <button class="btn admin-only" id="btn-cost-upload"></button>
    <input type="file" id="cost-file" accept=".xlsx" multiple style="display:none">
  </div>
  <div id="cost-log" class="uplog" style="display:none"></div>
  <div class="card">
    <h2 id="cost-title">COSTING PENDING</h2>
    <div class="tw"><table id="t-cost"></table></div>
  </div>
</section>
<section class="panel" id="p-score">
  <div class="tiles" id="score-tiles"></div>
  <div class="toolbar">
    <div class="chips" id="score-years"></div>
    <span style="width:14px"></span>
    <div class="chips" id="score-views"></div>
    <span class="spacer"></span>
    <input class="search" id="score-search" type="search">
    <button class="btn admin-only" id="btn-score-upload"></button>
    <input type="file" id="score-file" accept=".xlsx" style="display:none">
  </div>
  <div id="score-log" class="uplog" style="display:none"></div>
  <div id="score-body"></div>
</section>
</main>
<script id="app-code" type="text/plain">
/* ---------- 3개 언어 ---------- */
const I18N = {
  ko: {
    title: 'JSV 샘플 현황 대시보드', proto: '프로토타입',
    tab_sales: '샘플 현황 차트 (영업)', tab_dev: '개발실 샘플 현황', tab_cost: '원가 현황',
    mode: '모드', mode_sales: '영업 (업로드 · 수정 · 취소)', mode_dev: '개발실 확인 (취소 건 최종 삭제)',
    pw_title: '개발실 모드', pw_msg: '개발실 모드 비밀번호를 입력하세요.', pw_ok: '확인', pw_cancel: '취소',
    pw_wrong: '비밀번호가 맞지 않습니다.',
    t_total_req: '전체 요청 건', t_pending_qty: '미접수 수량', t_total_qty: '전체 수량 (전 브랜드)',
    t_cancel_wait: '취소 — 삭제 대기', t_brands: '개 브랜드', t_pending_note: '건 · 주황색 표시 대상',
    t_cancel_note0: '대기 중인 취소 건 없음', t_cancel_note: '개발실 확인 후 최종 삭제',
    b_pending_only: '미접수만 보기', b_all: '전체 보기', b_cancel_only: '취소 건만 보기',
    b_done: '완료 건 보기', b_done_hide: '완료 건 숨기기', b_upload: '엑셀 업로드',

      const rows = s.rows.map((r, ri) => {
        const cells = r.map((c, ci) => {
          if (c == null || c.v === '' || c.v == null) return c && c.s ? `<c r="${col(ci+1)}${ri+1}" s="${c.s}"/>` : '';
          const ref = `${col(ci+1)}${ri+1}`;
          if (typeof c.v === 'number') return `<c r="${ref}" s="${c.s||0}"><v>${c.v}</v></c>`;

        const ht = (ri >= (s.headRows || 0) && s.rowHeight) ? ` ht="${s.rowHeight}" customHeight="1"` : '';
        return `<row r="${ri+1}"${ht}>${cells}</row>`;
      }).join('');
      /* 가로 인쇄 + 폭 맞춤 (printCol 지정 시) */
      const pr = s.printCol ? '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>' : '';
      const ps = s.printCol
        ? '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>' +
          '<pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/>'
        : '';
      add(`xl/worksheets/sheet${i+1}.xml`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${pr}${cols}<sheetData>${rows}</sheetData>${ps}</worksheet>`);
    });
    return zip(f);
  }
  return { build };
})();

/* ---- 최소 XLSX 리더 (브라우저 내장 DecompressionStream 사용) ---- */
const XR = (() => {
  const dec = new TextDecoder();

  async function inflate(u8, method) {
    if (method === 0) return u8;
    if (typeof DecompressionStream === 'undefined') throw new Error('NO_DS');
    const ds = new DecompressionStream('deflate-raw');
    const buf = await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
    return new Uint8Array(buf);
  }

  async function unzip(ab) {
    const u8 = new Uint8Array(ab), dv = new DataView(ab);
    let eo = -1;
    for (let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--)
      if (dv.getUint32(i, true) === 0x06054b50) { eo = i; break; }
    if (eo < 0) throw new Error('ZIP 형식이 아닙니다');
    let n = dv.getUint16(eo + 10, true), off = dv.getUint32(eo + 16, true);
    const files = {};
    for (let i = 0; i < n; i++) {
      const method = dv.getUint16(off + 10, true);
      const csize = dv.getUint32(off + 20, true);
      const nlen = dv.getUint16(off + 28, true), elen = dv.getUint16(off + 30, true);
      const clen = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true);
      const name = dec.decode(u8.subarray(off + 46, off + 46 + nlen));
      const lnl = dv.getUint16(lho + 26, true), lel = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lnl + lel;
      files[name] = { data: u8.subarray(start, start + csize), method };
      off += 46 + nlen + elen + clen;
    }
    const out = {};
    for (const k of Object.keys(files))
      out[k] = dec.decode(await inflate(files[k].data, files[k].method));
    return out;
  }

  const unesc = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, (_, d) => String.fromCharCode(+d))
    .replace(/&amp;/g, '&');
  const txt = frag => { let o = ''; frag.replace(/<t[^>]*>([\s\S]*?)<\/t>/g, (_, v) => { o += unesc(v); return ''; }); return o; };
  const colIdx = ref => { let n = 0; for (const c of ref.replace(/\d+/g, '')) n = n * 26 + (c.charCodeAt(0) - 64); return n; };

  /* 엑셀 날짜 시리얼 → yyyy-mm-dd */
  const serialDate = v => {
    const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
    return isNaN(d) ? String(v) : d.toISOString().slice(0, 10);
  };

  let RAW = null;
  async function readSheets(ab) {
    RAW = ab;
    const f = await unzip(ab);
    const shared = [];
    if (f['xl/sharedStrings.xml'])
      f['xl/sharedStrings.xml'].replace(/<si>([\s\S]*?)<\/si>/g, (_, s) => { shared.push(txt(s)); return ''; });
    /* 시트 이름 + 파일 매핑 */
    const rels = {};
    (f['xl/_rels/workbook.xml.rels'] || '').replace(/<Relationship([^>]*)\/>/g, (_, a) => {
      const id = (a.match(/Id="([^"]+)"/) || [])[1], t = (a.match(/Target="([^"]+)"/) || [])[1];
      if (id && t) rels[id] = t.replace(/^\/?xl\//, '').replace(/^\//, '');
      return '';
    });
    const sheets = [];
    (f['xl/workbook.xml'] || '').replace(/<sheet([^>]*)\/>/g, (_, a) => {
      if (/state="(hidden|veryHidden)"/.test(a)) return '';   /* 숨김 시트 제외 */
      const nm = unesc((a.match(/name="([^"]*)"/) || [])[1] || '');
      const rid = (a.match(/r:id="([^"]+)"/) || [])[1];
      let path = rels[rid] || '';
      if (path && !path.startsWith('worksheets/')) path = path.replace(/^.*worksheets\//, 'worksheets/');
      sheets.push({ name: nm, path: 'xl/' + path });
      return '';
    });
    /* 스타일: 날짜 서식 여부 */
    const numFmt = {};
    (f['xl/styles.xml'] || '').replace(/<numFmt([^>]*)\/>/g, (_, a) => {
      const id = (a.match(/numFmtId="(\d+)"/) || [])[1], c = (a.match(/formatCode="([^"]*)"/) || [])[1] || '';
      if (id) numFmt[id] = c; return '';
    });
    const fillColors = [];
    (f['xl/styles.xml'] || '').replace(/<fills[^>]*>([\s\S]*?)<\/fills>/, (_, b) => {
      b.replace(/<fill>([\s\S]*?)<\/fill>/g, (__, one) => {
        if (!/patternType="solid"/.test(one)) { fillColors.push(''); return ''; }
        const m = one.match(/<fgColor[^>]*rgb="([0-9A-Fa-f]{6,8})"/);
        fillColors.push(m ? m[1].slice(-6).toUpperCase() : 'THEME');
        return '';
      });
      return '';
    });
    const xfFill = [];
    const xfIds = [];
    (f['xl/styles.xml'] || '').replace(/<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/, (_, b) => {
      b.replace(/<xf([^>]*)[/>]/g, (__, a) => {
        xfIds.push((a.match(/numFmtId="(\d+)"/) || [])[1] || '0');
        xfFill.push(fillColors[+((a.match(/fillId="(\d+)"/) || [])[1] || 0)] || '');
        return '';
      });
      return '';
    });
    const isDate = s => {
      const id = xfIds[+s || 0] || '0';
      if (['14','15','16','17','22','164','165','166','167'].includes(id)) return true;
      return /[ymd]/.test(numFmt[id] || '') && !/[#0]/.test((numFmt[id] || '').replace(/\[[^\]]*\]/g, ''));
    };

    /* --- 시트별 이미지 (drawing anchor row → dataURL) --- */
    let media = null;
    async function imagesFor(sheetPath, xml) {
      const res = {};
      const dr = (xml.match(/<drawing[^>]*r:id="([^"]+)"/) || [])[1];
      if (!dr) return res;
      const relPath = sheetPath.replace(/([^/]+)$/, '_rels/$1.rels');
      const rels = f[relPath]; if (!rels) return res;
      let target = '';
      rels.replace(/<Relationship([^>]*)\/>/g, (_, a) => {
        if ((a.match(/Id="([^"]+)"/) || [])[1] === dr) target = (a.match(/Target="([^"]+)"/) || [])[1] || '';
        return '';
      });
      if (!target) return res;
      const dpath = ('xl/' + target.replace(/^\.\.\//, '')).replace(/\/\.\//g, '/');
      const dxml = f[dpath]; if (!dxml) return res;
      const drels = f[dpath.replace(/([^/]+)$/, '_rels/$1.rels')] || '';
      const rmap = {};
      drels.replace(/<Relationship([^>]*)\/>/g, (_, a) => {
        const id = (a.match(/Id="([^"]+)"/) || [])[1];
        const t = (a.match(/Target="([^"]+)"/) || [])[1] || '';
        if (id) rmap[id] = 'xl/' + t.replace(/^\.\.\//, '');
        return '';
      });
      if (!media) media = await unzipBinary(RAW);
      const MT = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', emf: '', wmf: '' };
      dxml.replace(/<xdr:(?:twoCellAnchor|oneCellAnchor)[\s\S]*?<\/xdr:(?:twoCellAnchor|oneCellAnchor)>/g, blk => {
        const row = +((blk.match(/<xdr:from>[\s\S]*?<xdr:row>(\d+)<\/xdr:row>/) || [])[1] || -1);
        const rid = (blk.match(/r:embed="([^"]+)"/) || [])[1];
        if (row < 0 || !rid || !rmap[rid]) return '';
        const path = rmap[rid], ext = (path.split('.').pop() || '').toLowerCase();
        if (!MT[ext] || !media[path]) return '';
        let s = ''; const u = media[path], CH = 0x8000;
        for (let i = 0; i < u.length; i += CH) s += String.fromCharCode.apply(null, u.subarray(i, i + CH));
        res[row + 1] = 'data:' + MT[ext] + ';base64,' + btoa(s);
        return '';
      });
      return res;
    }

    const out = [];
    for (const sh of sheets) {
      const xml = f[sh.path]; if (!xml) continue;
      const rows = [];
      xml.replace(/<row([^>]*)r="(\d+)"([^>]*)>([\s\S]*?)<\/row>/g, (_, a1, rn, a2, body) => {
        if (/hidden="(1|true)"/.test(a1 + a2)) return '';     /* 숨김 행 제외 */
        const cells = [];
        body.replace(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g, (__, attr, inner) => {
          const ref = (attr.match(/r="([A-Z]+\d+)"/) || [])[1];
          const t = (attr.match(/t="([^"]+)"/) || [])[1] || 'n';
          const s = (attr.match(/s="(\d+)"/) || [])[1] || '0';
          let v = '';
          if (inner) {
            if (t === 's') { const m = inner.match(/<v>(\d+)<\/v>/); v = m ? shared[+m[1]] : ''; }
            else if (t === 'inlineStr') v = txt(inner);
            else if (t === 'str') { const m = inner.match(/<v>([\s\S]*?)<\/v>/); v = m ? unesc(m[1]) : ''; }
            else {
              const m = inner.match(/<v>([\s\S]*?)<\/v>/);
              v = m ? unesc(m[1]) : '';
              if (v !== '' && !isNaN(+v) && +v > 20000 && +v < 80000 && isDate(s)) v = serialDate(+v);
            }
          }
          if (ref) {
            cells[colIdx(ref) - 1] = String(v).trim();
            const fc = xfFill[+s || 0] || '';
            if (fc) (cells.fills = cells.fills || {})[colIdx(ref) - 1] = fc;
          }
          return '';
        });
        rows[+rn - 1] = cells;
        return '';
      });
      out.push({ name: sh.name, rows: rows.map(r => r || []), images: await imagesFor(sh.path, xml) });
    }
    return out;
  }
  async function unzipBinary(ab) {
    const u8 = new Uint8Array(ab), dv = new DataView(ab);
    let eo = -1;
    for (let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--)
      if (dv.getUint32(i, true) === 0x06054b50) { eo = i; break; }
    if (eo < 0) throw new Error('ZIP 형식이 아닙니다');
    let n = dv.getUint16(eo + 10, true), off = dv.getUint32(eo + 16, true);
    const out = {};
    for (let i = 0; i < n; i++) {
      const method = dv.getUint16(off + 10, true);
      const csize = dv.getUint32(off + 20, true);
      const nlen = dv.getUint16(off + 28, true), elen = dv.getUint16(off + 30, true);
      const clen = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true);
      const raw = u8.subarray(off + 46, off + 46 + nlen);
      let name;
      try { name = new TextDecoder('utf-8', { fatal: true }).decode(raw); }
      catch (e) { name = new TextDecoder('euc-kr').decode(raw); }
      const lnl = dv.getUint16(lho + 26, true), lel = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lnl + lel;
      if (!name.endsWith('/'))
        out[name] = await inflate(u8.subarray(start, start + csize), method);
      off += 46 + nlen + elen + clen;
    }
    return out;
  }
  return { readSheets, unzipBinary };
})();

        r[cb.dataset.k] = ev.target.checked;
        drawChips(); drawSales(); dirty('requests');
      };
    });
    tr.querySelectorAll('.cellin, .cmt').forEach(inp => {
      inp.onchange = ev => {

        if (TRACKF.includes(f)) {
          const norm = s => String(s ?? '').replace(/\r\n?/g, '\n').trim();
          const a = norm(r[f] === 0 ? '' : r[f]), b2 = norm(nv === 0 ? '' : nv);
          if (a !== b2) r.changes = Object.assign({}, r.changes, { [f]: { from: a || '(없음)', to: b2 } });
        }
        r[f] = nv;
        drawSales(); dirty('requests');
      };
      /* textarea 자동 높이 */
      if (inp.classList.contains('ta')) {
        const grow = () => { inp.style.height = 'auto'; inp.style.height = (inp.scrollHeight + 2) + 'px'; };

      } else r.comment = (r.comment || '').replace(/\[취소 \d{4}-\d{2}-\d{2}\]\s*/, '');
      drawChips(); drawSales(); dirty('requests');
    };
    const dbt = tr.querySelector('.rowdel');
    if (dbt) dbt.onclick = () => {
      if (!can.del(r)) return;
      if (!confirm(`${r.brand_full} / ${r.season} / ${r.stage}`)) return;
      const i = R.findIndex(x => x.id === r.id);
      if (i >= 0) R.splice(i, 1);
      drawChips(); drawSales(); dirty('requests');

  el('sales-legend').innerHTML =
    `<span><i class="sw" style="background:var(--recv-bg);border-color:var(--recv-line)"></i>${T('lg_recv')}</span>

     <span><i class="sw" style="background:#f9d5d5;border-color:#e8b4b4"></i>${T('lg_cancel')}</span>
     <span><i class="sw" style="background:var(--changed)"></i>${T('lg_changed')}</span>`;

const XW_W = [3, 9, 10, 30, 14, 8, 8, 24, 18, 22, 40];
function sheetFor(brand) {
  const list = ofBrand(brand).filter(visible);
  const rows = [];
  rows.push([null, { v: brand + '_Sample Plan', s: 6 }]);
  rows.push([null, null, null, null, null, null, null, null, null, null, { v: TODAY }]);
  rows.push([null, null, null, null, { v: "Q'ty", s: 1 }, { v: '', s: 1 },
             { v: 'Sample ws pass date', s: 1 }, { v: 'MATL Schedule', s: 1 }, { v: 'Status', s: 1 }, { v: '', s: 1 }]);
  rows.push(['', 'Brand', 'Season', 'Stage', 'XF date', 'HB', 'SLG', T('c_ws'), T('c_mtrl'), T('c_status'), T('c_remark')]
            .map((c, i) => i === 0 ? null : { v: c, s: 1 }));
  let hb = 0, slg = 0;
  for (const r of list) {
    hb += r.hb; slg += r.slg;
    const base = r.cancelled ? 7 : (r.received ? 9 : 3);
    const red  = r.cancelled ? 8 : (r.received ? 10 : 5);
    const sty = f => (r.changes[f] ? red : base);
    const auto = changeText(r);
    const remark = [r.cancelled ? '[CANCEL]' : '', auto ? '[CHG] ' + auto : '',
                    r.comment || r.remarks || ''].filter(Boolean).join(' / ');
    rows.push([null, { v: AB(r.brand), s: base }, { v: r.season, s: base }, { v: r.stage, s: base },
      { v: r.xf, s: sty('xf') }, { v: r.hb || '', s: sty('hb') }, { v: r.slg || '', s: sty('slg') },
      { v: r.ws_pass, s: sty('ws_pass') }, { v: r.mtrl_sched || '', s: base },
      { v: r.status || '', s: base }, { v: remark, s: auto ? red : base }]);
  }
  rows.push([null, null, null, null, { v: 'TOTAL', s: 1 }, { v: hb, s: 1 }, { v: slg, s: 1 },
             { v: '', s: 1 }, { v: '', s: 1 }, { v: '', s: 1 }, { v: '', s: 1 }]);
  /* printCol: 'K'(Remark)까지 인쇄 영역 + 가로 인쇄 */
  return { name: brand, cols: XW_W, rows, rowHeight: 29.25, headRows: 2, printCol: 'K' };
}
function saveXlsx(sheets, name) {
  const url = URL.createObjectURL(new Blob([XW.build(sheets)],
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  const a = document.createElement('a');
  a.href = url; a.download = name + '_' + TODAY + '.xlsx'; a.click(); URL.revokeObjectURL(url);
}
el('btn-xlsx-all').onclick = () => saveXlsx(BRANDS.map(sheetFor), 'Sample Plan_ALL');

/* 완료 판정·단계 분류: CUTTING/SEWING만 표시 */
const isDate = v => /^\d{4}-\d{2}-\d{2}/.test(String(v || ''));
const activeDev = e => {
  if (String(e.finished || '').toUpperCase() === 'DONE') return false;
  if (isDate(e.finished) && String(e.finished).slice(0, 10) <= TODAY) return false;
  if (e.balance_n === 0) return false;               /* 잔량 0 = 완료 */
  return true;
};
/* 조립: SEWING 날짜 경과 / 재단·기리메: CUT 또는 PAINTING 날짜 경과 / 그 외: 대기(아직 미진행) */
const stageOf = e => {
  if (isDate(e.sewing) && String(e.sewing).slice(0, 10) <= TODAY) return 'SEW';
  if ((isDate(e.cut) && String(e.cut).slice(0, 10) <= TODAY) ||
      (isDate(e.painting) && String(e.painting).slice(0, 10) <= TODAY)) return 'CUT';
  return 'WAIT';
};
el('dev-search').oninput = e => { devQ = e.target.value.trim().toLowerCase(); drawDev(); };

/* 브랜드 이름/약어를 그대로 검색하면 해당 브랜드만 필터 (스타일명 부분일치 혼입 방지) */
const BR_ALIAS = { GS:'GUESS', GF:'GUESS', GUESS:'GUESS', TU:'TOUS', TOUS:'TOUS', ST:'STAUD', STAUD:'STAUD',
  BE:'BEIS', BEIS:'BEIS', SN:'STANLEY', STANLEY:'STANLEY', CH:'CH', COACH:'CH', AM:'AMAZON', AMAZON:'AMAZON',
  ME:'MEEM', MEEM:'MEEM', QN:'QUINCE', QU:'QUINCE', QUINCE:'QUINCE', UG:'UGG', UGG:'UGG', GAP:'GAP',
  KE:'KEEK', KEEK:'KEEK', MJ:'MARC JACOB' };
const brandQ = q => BR_ALIAS[String(q || '').trim().toUpperCase()] || null;
const hit = (e, q) => {
  if (!q) return true;
  const b = brandQ(q);
  if (b) return e.brand === b;
  return [e.brand, e.style, e.pattern, e.mk_style, e.group, e.color, e.season, e.sample_type]
    .some(v => String(v || '').toLowerCase().includes(q));
};

/* ---------- 엑셀 업로드 → Sample Plan 반영 ---------- */
const BR_CODE = { GAP:'GAP', BE:'BEIS', BEIS:'BEIS', UG:'UGG', UGG:'UGG', ST:'STAUD', STAUD:'STAUD',
  AM:'AMAZON', AMAZON:'AMAZON', CH:'CH', ME:'MEEM', MEEM:'MEEM', GF:'GUESS', GS:'GUESS', GUESS:'GUESS',
  TU:'TOUS', TOUS:'TOUS', SN:'STANLEY', STANLEY:'STANLEY', QN:'QUINCE', QUINCE:'QUINCE' };

const FIELD_OF = h => {
  const t = (h || '').toLowerCase().replace(/\s+/g, ' ').trim();
  if (/^brand/.test(t)) return 'brand';
  if (/^season/.test(t)) return 'season';
  if (/^stage/.test(t)) return 'stage';
  if (/xf/.test(t)) return 'xf';
  if (/^hb$/.test(t)) return 'hb';
  if (/^slg$/.test(t)) return 'slg';
  if (/작지|ws pass/.test(t)) return 'ws_pass';
  if (/자재|matl|material/.test(t)) return 'mtrl_sched';
  if (/현황|status/.test(t)) return 'status';
  if (/remark/.test(t)) return 'remarks';
  return null;
};

const keyOf = r => [r.brand_full, (r.season || '').toUpperCase(), (r.stage || '').toUpperCase().trim(),
                    (r.xf || '').trim()].join('|');
const num = v => { const m = String(v || '').replace(/,/g, '').match(/\d+/); return m ? +m[0] : 0; };

const YELLOWISH = h => {
  if (!h || h === 'THEME') return false;
  const x = h.toUpperCase();
  if (x === 'FFFFFF') return false;
  if (['FFEB9C', 'FFF2CC', 'FFE699'].includes(x)) return true;
  return x.startsWith('FFFF') && parseInt(x.slice(4), 16) < 0xE0;
};
function sheetToRecords(rows) {
  let hi = -1;
  for (let i = 0; i < Math.min(rows.length, 25); i++)
    if ((rows[i] || []).some(c => /^brand$/i.test((c || '').trim()))) { hi = i; break; }
  if (hi < 0) return [];
  const above = rows[hi - 1] || [];
  const below = rows[hi + 1] || [];
  const map = {};
  rows[hi].forEach((c, j) => {
    const f = FIELD_OF(c) || FIELD_OF(above[j]);
    if (f && !(f in map)) map[f] = j;
  });
  /* HB/SLG가 헤더 아랫줄에 있는 양식(Q'ty 병합 헤더) 지원 */
  let start = hi + 1;
  const subFields = below.map(c => FIELD_OF(c));
  if (subFields.some(f => f === 'hb' || f === 'slg')) {
    below.forEach((c, j) => { const f = FIELD_OF(c); if (f && !(f in map)) map[f] = j; });
    start = hi + 2;
  }
  if (!('brand' in map) || !('stage' in map)) return [];
  const out = [];
  for (let i = start; i < rows.length; i++) {
    const row = rows[i]; if (!row || !row.length) continue;
    const g = f => (map[f] != null ? (row[map[f]] || '').trim() : '');
    if (/^total$/i.test(g('stage')) || row.some(c => /^total$/i.test((c || '').trim()) && !g('brand'))) continue;
    let brand = g('brand');
    if (!brand && out.length) brand = out[out.length - 1].brandRaw;
    if (!brand) continue;
    const rowYellow = Object.values(row.fills || {}).some(YELLOWISH);
    const rec = { brandRaw: brand, brand, brand_full: BR_CODE[brand.toUpperCase()] || brand.toUpperCase(),
      season: g('season'), stage: g('stage'), xf: g('xf'),
      hb: num(g('hb')), slg: num(g('slg')), ws_pass: g('ws_pass'),
      mtrl_sched: g('mtrl_sched'), status: g('status'), remarks: g('remarks'),
      received: !rowYellow };            /* 흰 배경 = 접수 완료 · 노란색 = 미접수 */
    if (!rec.stage && !rec.xf && !rec.hb && !rec.slg) continue;
    out.push(rec);
  }
  return out;
}

const CMP = ['season', 'stage', 'xf', 'hb', 'slg', 'ws_pass', 'mtrl_sched', 'status'];

async function handleUpload(fileList) {
  const box = el('upload-log');
  box.style.display = 'block';
  box.innerHTML = '<span class="muted">읽는 중…</span>';
  let added = 0, updated = 0, changedCells = 0, files = 0, brands = new Set(), note = '', xlsWarn = false;
  try {
    for (const file of fileList) {
      if (/\.xls$/i.test(file.name)) { xlsWarn = true; continue; }
      const sheets = await XR.readSheets(await file.arrayBuffer());
      const recs = [];
      const parsed = sheets.map(s => ({ name: s.name, recs: sheetToRecords(s.rows) })).filter(s => s.recs.length);
      if (!parsed.length) continue;
      /* 시트 이름이 "...(2)", "...(3)"처럼 같은 이름의 주차별 복사본이면 마지막 시트만 사용.
         브랜드별로 이름이 다른 시트면(전체 다운로드 파일) 전부 사용. */
      /* TU/SN 계열 파일은 주차마다 시트를 복사하므로 항상 마지막(최신) 시트만 사용 */
      const tuSn = /^(TU|TU_SN|TN_SN)[\s_-]/i.test(file.name) ||
        parsed.some(s => /sample\s*q'?ty/i.test(s.name)) ||
        parsed.every(s => s.recs.every(r => ['TOUS', 'STANLEY', 'QUINCE'].includes(r.brand_full)));
      const numbered = parsed.filter(s => /\(\d+\)\s*$/.test(s.name)).length;
      const versioned = parsed.length > 1 && (tuSn || (parsed.length > 3 && numbered >= parsed.length / 2));
      const use = versioned ? [parsed[parsed.length - 1]] : parsed;
      if (versioned) note = `시트 ${parsed.length}개 중 최신 시트(${use[0].name})만 사용`;
      use.forEach(s => recs.push(...s.recs));
      files++;

      const seen = new Set();
      for (const rec of recs) {
        brands.add(rec.brand_full);
        const k = keyOf(rec);
        let cur = R.find(x => keyOf(x) === k && !seen.has(x.id));
        if (!cur) {
          cur = R.find(x => x.brand_full === rec.brand_full &&
            (x.season || '').toUpperCase() === (rec.season || '').toUpperCase() &&
            (x.stage || '').toUpperCase().trim() === (rec.stage || '').toUpperCase().trim() &&
            !seen.has(x.id));
        }
        if (cur) {
          seen.add(cur.id);
          const ch = {};
          const norm = s => String(s ?? '').replace(/\r\n?/g, '\n').trim();
          for (const f of CMP) {
            const a = norm(cur[f]), b = norm(rec[f]);
            if (b !== '' && a !== b) { ch[f] = { from: a || '(없음)', to: b }; cur[f] = rec[f]; }
          }
          if (rec.remarks) cur.remarks = rec.remarks;
          if (!cur.cancelled) cur.received = rec.received;   /* 파일 배경색 기준 접수 상태 동기화 */
          if (Object.keys(ch).length) {
            cur.changes = Object.assign({}, cur.changes, ch);
            changedCells += Object.keys(ch).length; updated++;
          }
        } else {
          R.unshift(Object.assign({
            id: 'U' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            orig: '', season_n: '', stage_n: '', done: false, cancelled: false,
            changes: {}, comment: '', isNew: true
          }, rec));
          added++;
        }
      }
    }
    BRANDS.length = 0;
    [...new Set(R.map(r => r.brand_full))].sort((x, y) => x.localeCompare(y)).forEach(b => BRANDS.push(b));
    /* 브랜드별 업로드 알림 갱신 (개발실 화면 상단에 표시, 개발실장 확인 전까지 빨간 점) */
    if (brands.size) {
      const now = new Date().toISOString();
      brands.forEach(b => { UPMETA[b] = { at: now, ack: '' }; });
      dirty('up_meta');
    }
    drawChips(); drawSales(); dirty('requests');
    box.innerHTML = `<b>✔ 반영 완료</b> — 파일 ${files}개 · 브랜드 ${[...brands].join(', ')} ·
      신규 <b>${added}</b>행 추가, <b>${updated}</b>행 갱신 (변경 셀 ${changedCells}개는 빨간 글씨 + Remark 자동 기입)
      ${note ? '<br><span class="muted">' + esc(note) + '</span>' : ''}
      ${xlsWarn ? '<br><span style="color:var(--critical)">샘플 펜딩 파일(.xls)은 .xlsx로 저장해서 올려주세요.</span>' : ''}`;
  } catch (e) {
    box.innerHTML = e.message === 'NO_DS'
      ? '<b style="color:var(--critical)">이 브라우저는 엑셀 압축 해제를 지원하지 않습니다.</b> Chrome 또는 Edge에서 열어주세요.'
      : '<b style="color:var(--critical)">읽기 실패:</b> ' + esc(e.message);
  }
}

/* ---------- Drag & Drop: 각 탭 어디에나 파일을 끌어다 놓으면 업로드 ---------- */
function bindDrop(panelId, handler) {
  const zone = el(panelId);
  ['dragenter', 'dragover'].forEach(t => zone.addEventListener(t, e => {
    e.preventDefault(); zone.classList.add('dropping');
  }));
  ['dragleave', 'drop'].forEach(t => zone.addEventListener(t, e => {
    e.preventDefault();
    if (t === 'dragleave' && zone.contains(e.relatedTarget)) return;
    zone.classList.remove('dropping');
    if (t === 'drop') {
      const files = [...e.dataTransfer.files].filter(f => /\.(xlsx|xls)$/i.test(f.name));
      if (files.length) handler(files);
    }
  }));
}

/* ---------- 개발실 파일 업로드 (관리자) ---------- */
const DEV_FIELD = h => {
  const t = (h || '').toLowerCase().replace(/\s+/g, ' ').trim();
  if (/request/.test(t)) return 'req_date';
  if (/in char/.test(t)) return 'in_charge';
  if (/sample type/.test(t)) return 'sample_type';
  if (/division/.test(t)) return 'division';
  if (/season/.test(t)) return 'season';
  if (/^group/.test(t)) return 'group';
  if (/style/.test(t)) return 'style';
  if (/color/.test(t)) return 'color';
  if (/q\.?ty|수량/.test(t)) return 'qty';
  if (/^hw$/.test(t)) return 'sh_hw';
  if (/zipper/.test(t)) return 'sh_zip';
  if (/main.*mtrl|main.*mat/.test(t)) return 'sh_mtrl';
  if (/deli|ngày xuất/.test(t)) return 'deli';
  if (/^cut/.test(t)) return 'cut';
  if (/painting/.test(t)) return 'painting';
  if (/sewing/.test(t)) return 'sewing';
  if (/finish/.test(t)) return 'finished';
  if (/pattern/.test(t)) return 'pattern';
  if (/remark/.test(t)) return 'remark';
  if (/^line/.test(t)) return 'line';
  return null;
};
const PFX = [['GF','GUESS'],['GS','GUESS'],['ST','STAUD'],['CH','CH'],['TU','TOUS'],['AM','AMAZON'],
             ['BE','BEIS'],['SN','STANLEY'],['ME','MEEM'],['KE','KEEK'],['QU','QUINCE'],
             ['MJ','MARC JACOB'],['UG','UGG']];

/* 사진 축소: 서버 저장 용량·시간 제한 대응 (긴 변 220px JPEG). 브라우저가 못 읽는
   그림(EMF 스케치 등)은 제외 — RECAP 재업로드 시 기존 사진이 대신 유지됨 */
async function shrinkPhoto(src) {
  if (!src) return '';
  if (src.length < 12000) return src;                 /* ~9KB 미만은 그대로 */
  try {
    const img = new Image();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = src; });
    const sc = Math.min(1, 220 / Math.max(img.width || 1, img.height || 1));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round((img.width || 1) * sc));
    c.height = Math.max(1, Math.round((img.height || 1) * sc));
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(img, 0, 0, c.width, c.height);
    const out = c.toDataURL('image/jpeg', 0.72);
    return out.length < src.length ? out : src;
  } catch (e) { return ''; }
}
async function shrinkImages(sheets) {
  for (const s of sheets) {
    if (!s.images) continue;
    for (const k of Object.keys(s.images)) s.images[k] = await shrinkPhoto(s.images[k]);
  }
}
/* 같은 스타일 블록에 사진이 하나라도 있으면 블록 전체에 전파 */
function spreadPhotos(list) {
  const by = {};
  list.forEach(e => {
    const k = (e.line || '') + '|' + String(e.style || '').toUpperCase();
    if (e.photo && !by[k]) by[k] = e.photo;
  });
  list.forEach(e => {
    const k = (e.line || '') + '|' + String(e.style || '').toUpperCase();
    if (!e.photo && by[k]) e.photo = by[k];
  });
  return list;
}
function devSheetToRecords(sheetName, rows, imgs) {
  let hi = -1;
  for (let i = 0; i < Math.min(rows.length, 20); i++)
    if ((rows[i] || []).some(c => /request\s*date/i.test((c || '').trim()))) { hi = i; break; }
  if (hi < 0) return [];
  const below = rows[hi + 1] || [];
  const map = {};
  rows[hi].forEach((c, j) => { const f = DEV_FIELD(c); if (f && !(f in map)) map[f] = j; });
  below.forEach((c, j) => { const f = DEV_FIELD(c); if (f && !(f in map)) map[f] = j; });
  const lineFromSheet = (sheetName.match(/LINE\s*(\d+)/i) || [])[1];
  const out = [];
  let last = null;
  for (let i = hi + 2; i < rows.length; i++) {
    const row = rows[i]; if (!row || !row.length) continue;
    const g = f => (map[f] != null ? (row[map[f]] || '').trim() : '');
    if (/^total$/i.test(g('qty')) || row.some(c => /^total$/i.test((c || '').trim()))) continue;
    if (!g('req_date') && !g('style') && !g('color')) continue;
    const e = {};
    ['req_date','in_charge','sample_type','division','season','group','style','color','qty',
     'sh_hw','sh_zip','sh_mtrl','deli','cut','painting','sewing','finished','pattern','remark']
      .forEach(f => e[f] = g(f));
    e.line = g('line') ? 'L' + g('line').replace(/[^0-9]/g, '') : (lineFromSheet ? 'L' + lineFromSheet : (last ? last.line : 'L?'));
    if (!e.group && last) e.group = last.group;
    if (!e.style && last) e.style = last.style;
    const s = (e.style || '').toUpperCase();
    e.brand = (PFX.find(p => s.startsWith(p[0])) || [])[1] ||
      (/TOUS/i.test(e.group) ? 'TOUS' : (last ? last.brand : 'ETC'));
    e.qty_n = +(String(e.qty).split('->').pop().replace(/[^0-9]/g, '')) || 0;
    const stages = [['CUT', e.cut], ['PAINTING', e.painting], ['SEWING', e.sewing], ['FINISHED', e.finished]];
    const planned = stages.filter(s2 => s2[1]);
    const done = planned.filter(s2 => /^\d{4}-\d{2}-\d{2}/.test(s2[1]) && s2[1] <= TODAY);
    e.progress = done.length;
    e.stage_label = done.length ? done[done.length - 1][0] : (planned.length ? '예정' : 'WAITING');
    e.deli_soon = /^\d{4}-\d{2}-\d{2}/.test(e.deli || '') && e.deli <= SOON_END;
    e.shortage = [e.sh_hw, e.sh_zip, e.sh_mtrl].filter(x => x && x.toUpperCase() !== 'OK').join(' / ');
    e.photo = (imgs && imgs[i + 1]) || (last && last.style === e.style ? last.photo : '') || '';
    last = e;
    out.push(e);
  }
  return spreadPhotos(out);
}

const e0FromRecap = e => !e.src_name;   /* 마켓 차트 파일 유래 행은 src_name 보유 */
const buyerCodes = e => {
  const set = new Set();
  for (const k of ['group', 'style', 'pattern']) {
    const s = String(e[k] || '').toUpperCase();
    (s.match(/[A-Z]{2}\d{6}/g) || []).forEach(c => set.add(c));            /* 바이어 코드 (예: SV360072) */
    (s.match(/[A-Z]{2,3}\d{3,5}[A-Z]?-\d+\b/g) || []).forEach(c => set.add(c)); /* JS 패턴 코드 (예: ST6090-7, CH168A-1) */
    (s.match(/[A-Z]{1,3}\d{4,6}[A-Z]?\b/g) || []).forEach(c => set.add(c));     /* 스타일 번호 (예: P127867, U09770, CH8295) */
  }
  return [...set];
};
const dupKeys = e => buyerCodes(e).map(c =>
  e.brand + '|' + c + '|' + String(e.color || '').toUpperCase().replace(/\s+/g, ' ').trim());
/* 마켓 차트와 RECAP 양쪽에 있는 스타일은 차트 행만 남긴다 (차트 파일의 완료분 포함) */
function dedupeMarket() {
  const chart = new Set();
  E.filter(e => e.src_name && e.source === 'MARKET').forEach(e => dupKeys(e).forEach(k => chart.add(k)));
  Object.values(MKCOV).forEach(list => (list || []).forEach(k => chart.add(k)));
  let removed = 0;
  for (let i = E.length - 1; i >= 0; i--) {
    const e = E[i];
    if (!e.src_name && e.source === 'MARKET') {
      if (dupKeys(e).some(k => chart.has(k))) { E.splice(i, 1); removed++; }
    }
  }
  return removed;
}
async function handleDevUpload(fileList) {
  const box = el('dev-log'); box.style.display = 'block';
  box.innerHTML = '<span class="muted">읽는 중…</span>';
  try {
    let added = 0, photoN = 0, pendN = 0, files = 0, srcs = new Set(), xlsWarn = false;
    for (const file of fileList) {
      if (/\.xls$/i.test(file.name)) { xlsWarn = true; continue; }
      const sheets = await XR.readSheets(await file.arrayBuffer());
      await shrinkImages(sheets);                     /* 서버 저장 실패 방지: 사진 축소 */
      let recs = [];
      sheets.forEach(s => devSheetToRecords(s.name, s.rows, s.images).forEach(r => recs.push(r)));
      let src = 'SAMPLE';   /* RECAP 형식 기본값 — 행별로 마켓/샘플 재분류됨 */
      /* 샘플 펜딩(노란색 하이라이트) 파일이면 미접수로 반영 */
      if (!recs.length) {
        const pend = []; let pTot = 0, pMk = 0, pSp = 0;
        sheets.forEach(s => { const got = pendingFromSheet(s); pTot += got.totBal || 0; pMk += got.mkBal || 0; pSp += got.spBal || 0; got.forEach(p => pend.push(p)); });
        if (pend.length) {
          PEND.length = 0; pend.forEach(p => PEND.push(p));
          PENDMETA.total_balance = pTot;
          PENDMETA.market_balance = pMk;
          PENDMETA.sample_balance = pSp;
          PENDMETA.yellow_balance = pend.reduce((s2, p2) => s2 + p2.balance_n, 0);
          pendN += pend.length; files++;
          drawDev();
          continue;
        }
      }
      let mkScanned = 0;
      if (!recs.length) {                       /* SAMPLE RECAP 양식이 아니면 마켓 샘플 차트로 해석 */
        const brand = BRAND_FROM_NAME(file.name);
        const name = file.name.replace(/\.xlsx$/i, '');
        const cov = new Set(MKCOV[brand] || []);
        sheets.forEach(s => {
          const got = marketSheetToRecords(s, brand, name);
          mkScanned += got.scanned || 0;
          (got.coverKeys || []).forEach(k => cov.add(k));
          got.forEach(r => recs.push(r));
        });
        if (mkScanned) MKCOV[brand] = [...cov];
        src = 'MARKET';
        /* 전부 완료된 마켓 파일: 해당 브랜드 마켓 데이터 비우기 */
        if (!recs.length && mkScanned > 0) {
          for (let i = E.length - 1; i >= 0; i--)
            if (E[i].source === 'MARKET' && E[i].brand === brand) E.splice(i, 1);
          srcs.add('MARKET'); files++;
          drawDev();
          continue;
        }
      }
      if (!recs.length) continue;
      srcs.add(src);
      /* 마켓은 같은 파일(브랜드) 단위로, 그 외는 구분 전체를 최신 파일로 교체 */
      if (src === 'MARKET') {
        const key = recs[0].brand;
        for (let i = E.length - 1; i >= 0; i--)
          if (E[i].source === 'MARKET' && E[i].brand === key && E[i].src_name) E.splice(i, 1);
      } else {
        /* SAMPLE RECAP 재업로드: 기존 사진 보존(브라우저가 못 읽는 EMF 스케치 등) 후 RECAP 유래 행 전체 교체 */
        const oldPh = {};
        E.forEach(x => {
          if (x.src_name || !x.photo) return;
          const sk = (x.line || '') + '|' + String(x.style || '').toUpperCase();
          oldPh[sk + '|' + String(x.color || '').toUpperCase()] = x.photo;
          if (!oldPh[sk]) oldPh[sk] = x.photo;
        });
        for (let i = E.length - 1; i >= 0; i--)
          if (!E[i].src_name) E.splice(i, 1);
        recs.forEach(r => {
          if (r.photo) return;
          const sk = (r.line || '') + '|' + String(r.style || '').toUpperCase();
          r.photo = oldPh[sk + '|' + String(r.color || '').toUpperCase()] || oldPh[sk] || '';
        });
      }
      const MKRE = /마켓|MKT|MARKET|\bSMS\b/i;
      recs.forEach((r, i) => {
        r.id = 'X' + Date.now().toString(36) + i;
        r.source = src === 'MARKET' ? 'MARKET'
          : (MKRE.test([r.sample_type, r.division].join(' ')) ? 'MARKET' : 'SAMPLE');
        E.push(r);
      });
      photoN += recs.filter(r => r.photo).length;
      added += recs.length;
    }
    const deduped = dedupeMarket();
    drawDev();
    if (added) dirty('execs', 'mk_cover');
    if (pendN) dirty('pending', 'pending_meta');
    box.innerHTML = `<b>✔ OK</b> — ${[...srcs].map(s => s === 'MARKET' ? T('s_market') : T('s_sample')).join(', ') || T('s_pending')} ·
      ${pendN ? `<b>${T('s_pending')} ${pendN}</b> · ` : ''}
      <b>${added}</b>행 반영${photoN ? ` · 사진 <b>${photoN}</b>장 자동 추출` : ''}${deduped ? ` · 중복 ${deduped}행 제외` : ''} (같은 브랜드의 기존 데이터는 교체)
      ${xlsWarn ? '<br><span style="color:var(--critical)">⚠ .xls 파일은 브라우저에서 읽을 수 없습니다 — 엑셀에서 [다른 이름으로 저장 → .xlsx]로 저장한 뒤 다시 올려주세요. (샘플 펜딩/생산계획서 파일)</span>' : ''}`;
  } catch (err) {
    box.innerHTML = '<b style="color:var(--critical)">읽기 실패:</b> ' + esc(err.message);
  }
}

/* ---------- 마켓 샘플 파일 파서 (브라우저) ---------- */
const MK_FIELD = [
  ['season',   /^season$/],
  ['stage',    /sample\s*stage|^stage$|^type$|^sample\s*\/?\s*costing/],
  ['pattern',  /pattern\s*no|pattern\s*#/],
  ['style',    /^style\s*no|^style$|^erp#$/],
  ['group',    /style\s*group\s*name|group\s*name|style\s*name|^collection$|^shape$/],
  ['color',    /color\s*name|^color$/],
  ['qty',      /total\s*q'?ty|^ttl$|^total$|^q'?\.?ty$/],
  ['deli',     /sample\s*x-?date|x-?date|xf-?dat|^delivery$/],
  ['ws',       /w\/?s\s*pass|worksheet\s*pass|^ws$/],
  ['mtrl',     /^mtrl$|material\s*status|^body$/],
  ['zip',      /zipper/],
  ['hw',       /^hw$/],
  ['maker',    /pattern\s*maker/],
  ['cut',      /^cutting$/],
  ['sewing',   /^sewing$/],
  ['finished', /^finished$|sample\s*status/],
  ['line',     /^line$/],
  ['fin_qty',  /finished\s*q'?ty/],
  ['balance',  /^balance$/],
  ['remark',   /^remarks?$|final\s*comment/],
];
const mkField = h => {
  const t = (h || '').replace(/\s+/g, ' ').trim().toLowerCase();
  const hit = MK_FIELD.find(([, re]) => re.test(t));
  return hit ? hit[0] : null;
};
const BRAND_FROM_NAME = n => {
  const u = n.toUpperCase();
  if (/TOUS|^TU/.test(u)) return 'TOUS';
  if (/GUESS|^GF|^GS/.test(u)) return 'GUESS';
  if (/^CH[_ -]|COACH/.test(u)) return 'CH';
  if (/^ST[_ -]|STAUD/.test(u)) return 'STAUD';
  if (/STANLEY|^SN/.test(u)) return 'STANLEY';
  if (/AMAZON|^AM/.test(u)) return 'AMAZON';
  if (/BEIS|^BE/.test(u)) return 'BEIS';
  return 'ETC';
};

function marketSheetToRecords(sheet, brand, srcName) {
  const rows = sheet.rows, imgs = sheet.images || {};
  let hi = -1;
  for (let i = 0; i < Math.min(rows.length, 20); i++)
    if ((rows[i] || []).filter(c => mkField(c)).length >= 5) { hi = i; break; }
  if (hi < 0) return [];
  const multi = {};
  rows[hi].forEach((c, j) => { const k = mkField(c); if (k) (multi[k] = multi[k] || []).push(j); });
  /* 샘플 진행 차트가 아니면(선적 스케줄 등) 무시: CUTTING/SEWING/FINISHED Q'TY/BALANCE 헤더 필요 */
  if (!(multi.cut || multi.sewing || multi.fin_qty || multi.balance)) return [];
  const out = []; let last = null; let scanned = 0; const cover = new Set();
  for (let i = hi + 1; i < rows.length; i++) {
    const row = rows[i] || [];
    const g = k => { for (const j of (multi[k] || [])) { const v = (row[j] || '').trim(); if (v) return v; } return ''; };
    if (!(g('style') || g('pattern') || g('color'))) continue;
    if (/^total$/i.test(g('style'))) continue;
    /* 노란색 행 = 미접수 (아직 접수 전) → 마켓 진행 수량에서 제외. 미접수 수량은 샘플 팬딩 파일이 기준 */
    if (row.fills && Object.values(row.fills).some(YELLOW)) continue;
    scanned++;
    /* 이 차트 파일이 다루는 스타일 키(완료분 포함) — RECAP 중복 제거용 */
    dupKeys({ brand, group: g('group'), style: g('style'), pattern: g('pattern'), color: g('color') })
      .forEach(k => cover.add(k));
    /* 완료 건 제외: 잔량(BALANCE) 0 또는 FINISHED Q'TY에 숫자 + 음영 */
    const balRaw = g('balance');
    const balN = /^\d+(\.\d+)?$/.test(balRaw) ? Math.round(+balRaw) : null;
    if (balN === 0) continue;
    if (multi.fin_qty) {
      const j = multi.fin_qty[0];
      const v = (row[j] || '').trim();
      if (/^\d+(\.\d+)?$/.test(v) && row.fills && row.fills[j]) continue;
    }
    const e = {
      brand, source: 'MARKET', src_name: srcName, division: 'MARKET',
      season: g('season'), style: g('style') || g('pattern'), pattern: g('pattern'),
      group: g('group'), color: g('color'),
      qty: balN != null ? String(balN) : g('qty'),   /* 마켓은 잔량(Balance) 기준 */
      balance_n: balN != null ? balN : undefined,
      deli: g('deli'),
      req_date: g('ws'), sh_hw: g('hw'), sh_zip: g('zip'), sh_mtrl: g('mtrl'),
      cut: g('cut'), painting: '', sewing: g('sewing'), finished: g('finished'),
      in_charge: g('maker'), pattern_maker: g('maker'), remark: g('remark'),
    };
    /* mk_style: 바이어 Style 번호 (GUESS F열). TOUS는 스타일 번호가 없어 빈칸 */
    if (e.pattern && !/\d/.test(e.style)) { e.group = (e.group + ' ' + e.style).trim(); e.style = e.pattern; e.mk_style = ''; }
    else e.mk_style = (e.style && e.style !== e.pattern) ? e.style : '';
    const ln = g('line');
    e.line = /\d/.test(ln) ? 'L' + ln.replace(/[^0-9]/g, '') : (last ? last.line : 'L?');
    ['group', 'style', 'season'].forEach(k => { if (!e[k] && last) e[k] = last[k]; });
    e.photo = imgs[i + 1] || (last && last.style === e.style ? last.photo : '');
    const st = (g('stage') || '').toUpperCase();
    e.sample_type = 'MARKET' + (['HB', 'SLG'].includes(st) ? ' (' + st + ')' : (st && st !== 'MARKET' ? ' · ' + st : ''));
    e.qty_n = +(String(e.qty).split('->').pop().replace(/[^0-9]/g, '')) || 0;
    const stages = [['CUT', e.cut], ['SEWING', e.sewing], ['FINISHED', e.finished]];
    const planned = stages.filter(s => s[1]);
    let done = planned.filter(s => /^\d{4}-\d{2}-\d{2}/.test(s[1]) && s[1] <= TODAY);
    if (String(e.finished).toUpperCase() === 'DONE') done = stages;
    e.progress = Math.min(4, done.length + (done.length === 3 ? 1 : 0));
    e.stage_label = done.length ? done[done.length - 1][0] : (planned.length ? '예정' : 'WAITING');
    e.deli_soon = /^\d{4}-\d{2}-\d{2}/.test(e.deli || '') && e.deli >= TODAY && e.deli <= SOON_END;
    e.shortage = [e.sh_hw, e.sh_zip, e.sh_mtrl]
      .filter(x => x && !/OK/i.test(x) && !/^READY$/i.test(x)).join(' / ');
    last = e; out.push(e);
  }
  spreadPhotos(out);
  out.scanned = scanned;
  out.coverKeys = [...cover];
  return out;
}

/* ---------- 샘플 펜딩(노란색 하이라이트) 파서 ---------- */
const YELLOW = c => /^FF(FF|F[0-9A-F])00$|^FFFF[0-9A-F]{2}$|^FFF[0-9A-F]{3}$/.test(c) ||
  ['FFFF00','FFFF99','FFFFCC','FFF200','FFEB9C','FFFFA6'].includes(c);
const PB = { TU:'TOUS', ST:'STAUD', GS:'GUESS', GF:'GUESS', AM:'AMAZON', BE:'BEIS',
             CH:'CH', SN:'STANLEY', ME:'MEEM', QN:'QUINCE', UG:'UGG', GAP:'GAP' };
function pendingFromSheet(sheet) {
  const rows = sheet.rows;
  let hi = -1;
  for (let i = 0; i < Math.min(rows.length, 20); i++)
    if ((rows[i] || []).some(c => /^buyer$/i.test((c || '').trim()))) { hi = i; break; }
  if (hi < 0) return [];
  const map = {};
  rows[hi].forEach((c, j) => {
    const t = (c || '').replace(/\s+/g, ' ').trim().toLowerCase();
    const k = /^buyer/.test(t) ? 'buyer' : /^division/.test(t) ? 'division' : /^group/.test(t) ? 'group'
      : /^pattern/.test(t) ? 'pattern' : /구\s*분|phan loai/.test(t) ? 'gubun' : /^line/.test(t) ? 'line'
      : /^style/.test(t) ? 'style' : /총수량|tong sl/.test(t) ? 'qty' : /잔량|con lai/.test(t) ? 'balance'
      : /^del/.test(t) ? 'deli' : /비고/.test(t) ? 'note' : null;
    if (k && !(k in map)) map[k] = j;
  });
  if (!('buyer' in map)) return [];
  const expCol = map.buyer > 0 ? map.buyer - 1 : null;   /* B열: 접수 예정일 (헤더 없음) */
  let cut = rows.length;
  for (let i = 0; i < rows.length; i++)
    if ((rows[i] || []).some(c => /계획\s*외/.test(c || ''))) { cut = i; break; }
  const out = []; let totBal = 0, mkBal = 0, spBal = 0;
  const MKB = /마켓|MKT|MARKET|SMS/i;
  for (let i = hi + 1; i < cut; i++) {
    const row = rows[i] || [];
    const fills = row.fills || {};
    const isYel = Object.values(fills).some(YELLOW);
    const buyerV = (map.buyer != null ? (row[map.buyer] || '').trim() : '');
    if (buyerV && !/^buyer$/i.test(buyerV)) {
      const bm = String(map.balance != null ? (row[map.balance] || '') : '').split('.')[0].match(/\d+/);
      if (bm) {
        totBal += +bm[0];
        if (!isYel) {
          const g2 = (map.gubun != null ? (row[map.gubun] || '') : '') + ' ' + (map.style != null ? (row[map.style] || '') : '');
          if (MKB.test(g2)) mkBal += +bm[0]; else spBal += +bm[0];
        }
      }
    }
    if (!isYel) continue;
    const g = k => (map[k] != null ? (row[map[k]] || '').trim() : '');
    const code = g('buyer').toUpperCase();
    const n = s => { const m = String(s).replace(/,/g, '').match(/\d+/); return m ? +m[0] : 0; };
    if (!code && !g('style')) continue;
    out.push({ buyer: code, brand: PB[code] || code || 'ETC', division: g('division'), group: g('group'),
      gubun: g('gubun'), pattern: g('pattern'), style: g('style'), line: g('line'),
      exp: expCol != null ? (row[expCol] || '').trim() : '',
      qty: g('qty'), balance: g('balance'), deli: g('deli'), note: g('note'),
      qty_n: n(g('qty')), balance_n: n(g('balance')) || n(g('qty')), id: 'U' + i });
  }
  out.totBal = totBal; out.mkBal = mkBal; out.spBal = spBal;
  return out;
}

/* ---------- 원가(COSTING PENDING) 업로드 ---------- */
const CB = { GUESS:'GUESS', TOUS:'TOUS', CH:'CH', ST:'STAUD', STAUD:'STAUD', AMAZON:'AMAZON',
  AM:'AMAZON', BEIS:'BEIS', BE:'BEIS', STANLEY:'STANLEY', SN:'STANLEY', MEEM:'MEEM',
  UGG:'UGG', QUINCE:'QUINCE', KEEK:'KEEK', GAP:'GAP' };
function costingFromSheet(sheet) {
  const rows = sheet.rows;
  let hi = -1;
  for (let i = 0; i < Math.min(rows.length, 12); i++)
    if ((rows[i] || []).some(c => /ws\s*received/i.test((c || '').trim()))) { hi = i; break; }
  if (hi < 0) return [];
  const map = {};
  rows[hi].forEach((c, j) => {
    const t = (c || '').replace(/\s+/g, ' ').trim().toLowerCase();
    const k = /ws received/.test(t) ? 'ws_date' : /^buyer/.test(t) ? 'buyer' : /^group/.test(t) ? 'group'
      : /^style/.test(t) ? 'style' : /^pattern/.test(t) ? 'pattern' : /용도/.test(t) ? 'purpose'
      : /요청/.test(t) ? 'req_date' : /완료예정/.test(t) ? 'due' : /실제 완료|ngay xong/.test(t) ? 'done'
      : /담당/.test(t) ? 'owner' : /remark/.test(t) ? 'remark' : null;
    if (k && !(k in map)) map[k] = j;
  });
  if (!('style' in map)) return [];
  const out = [];
  for (let i = hi + 1; i < rows.length; i++) {
    const row = rows[i] || [];
    /* 색이 칠해진(처리 완료) 행 제외 — 흰색 배경은 색으로 치지 않음 */
    if (row.fills && Object.values(row.fills).some(c => c && c !== 'FFFFFF')) continue;
    const g = k => (map[k] != null ? (row[map[k]] || '').trim() : '');
    if (!(g('ws_date') || g('style') || g('pattern'))) continue;
    if (g('done')) continue;                          /* 실제 완료일 입력 = 완료 행 제외 */
    const e = { ws_date: g('ws_date'), buyer: g('buyer'), group: g('group'), style: g('style'),
      pattern: g('pattern'), purpose: g('purpose'), req_date: g('req_date'), due: g('due'),
      done: '', owner: g('owner'), remark: g('remark') };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(e.ws_date)) { e.remark = (e.ws_date + ' ' + e.remark).trim(); e.ws_date = ''; }
    e.brand = CB[(e.buyer || '').toUpperCase()] || (e.buyer || '').toUpperCase() || 'ETC';
    e.state = 'OPEN';
    e.late = !!e.due && e.due < TODAY;
    e.id = 'C' + i;
    out.push(e);
  }
  return out;
}
async function handleCostUpload(fileList) {

/* ---------- 바이어별 작업 분포도 (SCORE.xlsx) ---------- */
const SC_PFX = [['GF','GF'],['GS','GF'],['ST','ST'],['CH','CH'],['TU','TU'],['AM','AM'],['BE','BE'],
  ['SN','SN'],['ME','ME'],['KE','KE'],['QN','QN'],['MJ','MJ'],['UG','UG'],['KS','KS'],['AY','AY'],['F','F']];
const scBrand = (pat, style) => {
  for (const s of [pat, style]) {
    const uu = String(s || '').toUpperCase().replace(/^'/, '').trim();
    for (const [p, b] of SC_PFX) if (uu.startsWith(p)) return b;
  }
  return 'ETC';
};
function scoreFromSheets(sheets) {
  const out = {};
  for (const sh of sheets) {
    if (!/^20\d\d/.test(sh.name)) continue;
    const rows = sh.rows;
    const hdr = rows[1] || [];
    const pm = hdr.indexOf('패턴사'), ln = hdr.indexOf('작업라인');
    if (pm < 0 || ln < 0) continue;
    let patSc = -1, lineSc = -1;
    for (let i = pm; i < ln; i++) if ((hdr[i] || '') === '점수') patSc = i;
    for (let i = ln; i < hdr.length; i++) if ((hdr[i] || '').startsWith('점수')) lineSc = i;
    const patCol = pm === 5 ? 4 : 5;
    const pat = {}, line = {};
    let nRows = 0;
    for (let r = 3; r < rows.length; r++) {
      const row = rows[r] || [];
      const maker = (row[pm] || '').trim(), lv = (row[ln] || '').trim();
      if (!maker && !lv) continue;
      nRows++;
      const b = scBrand(row[patCol], row[3]);
      const ps = /^-?\d+(\.\d+)?$/.test(row[patSc] || '') ? +row[patSc] : null;
      const ls = /^-?\d+(\.\d+)?$/.test(row[lineSc] || '') ? +row[lineSc] : null;
      if (maker) {
        const key = maker.charAt(0).toUpperCase() + maker.slice(1).toLowerCase();
        const dd = (pat[key] = pat[key] || {}); const a = (dd[b] = dd[b] || [0, 0, 0]);
        a[0]++; if (ps !== null) { a[1] += ps; a[2]++; }
      }
      if (/^\d+$/.test(lv)) {
        const dd = (line['L' + lv] = line['L' + lv] || {}); const a = (dd[b] = dd[b] || [0, 0, 0]);
        a[0]++; if (ls !== null) { a[1] += ls; a[2]++; }
      }
    }
    out[sh.name] = { pat, line, rows: nRows };
  }
  return out;
}

      const sheets = await XR.readSheets(await file.arrayBuffer());

/* ---- 영업 차트(requests) 병합 저장 ----
   여러 명이 동시에 수정할 때 서로의 변경을 덮어쓰지 않도록,
   저장 직전에 서버 최신본을 받아 행 단위로 병합한다.
   REQ_BASE = 마지막 동기화 시점의 행별 스냅샷 (내가 뭘 바꿨는지 판별용) */
let REQ_BASE = {};
function snapReq() { REQ_BASE = {}; R.forEach(r => { REQ_BASE[r.id] = JSON.stringify(r); }); }
function mergeReq(server) {
  const localBy = {}; R.forEach(r => { localBy[r.id] = r; });
  const seen = new Set(); const out = [];
  server.forEach(s => {
    seen.add(s.id);
    const l = localBy[s.id];
    if (!l) { if (!(s.id in REQ_BASE)) out.push(s); return; }   /* 내가 삭제한 행이면 제외, 남의 신규면 유지 */
    out.push(JSON.stringify(l) !== REQ_BASE[s.id] ? l : s);      /* 내가 고친 행은 내 것, 아니면 서버 것 */
  });
  R.forEach(l => {
    if (seen.has(l.id)) return;
    if (!(l.id in REQ_BASE)) out.unshift(l);                     /* 내 신규 행 */
    else if (JSON.stringify(l) !== REQ_BASE[l.id]) out.push(l);  /* 남이 지웠지만 내가 고친 행은 보존 */
  });
  return out;
}

/* 다른 사람이 저장하면(내 미저장 변경이 없을 때) 화면 이동 없이 데이터만 갈아끼움 —

async function sbRefresh() {

  });
  for (const k in chunks) if (!(k in D)) D[k] = [].concat.apply([], chunks[k].filter(Boolean));
  const putArr = (a, v) => { a.length = 0; (v || []).forEach(x => a.push(x)); };
  const putObj = (o, v) => { Object.keys(o).forEach(k => delete o[k]); Object.assign(o, v || {}); };
  putArr(R, D.requests); putArr(E, D.execs); putArr(PEND, D.pending); putArr(COST, D.costing);
  putObj(PENDMETA, D.pending_meta); putObj(SCORE, D.score); putObj(MKCOV, D.mk_cover);
